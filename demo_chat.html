<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantum Guard AI — Protected LLM Gateway</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    background: #1a1a2e;
    border-bottom: 1px solid #16213e;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .shield { font-size: 24px; }
  .header-title { font-size: 16px; font-weight: 600; color: #a78bfa; }
  .header-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; margin-left: auto;
    box-shadow: 0 0 6px #22c55e;
  }
  .status-label { font-size: 12px; color: #22c55e; }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
  }
  .message.user {
    align-self: flex-end;
    background: #2d1b69;
    border: 1px solid #4c1d95;
  }
  .message.assistant {
    align-self: flex-start;
    background: #1f2937;
    border: 1px solid #374151;
  }
  .message.blocked {
    align-self: flex-start;
    background: #1f0a0a;
    border: 1px solid #7f1d1d;
  }
  .message.system {
    align-self: center;
    background: #111827;
    border: 1px solid #1f2937;
    font-size: 12px;
    color: #6b7280;
    max-width: 90%;
    text-align: center;
  }

  /* Security badge */
  .security-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .badge-high    { background: #1f0a0a; color: #f87171; border: 1px solid #7f1d1d; }
  .badge-moderate{ background: #1a1200; color: #fbbf24; border: 1px solid #92400e; }
  .badge-low     { background: #0a1a0a; color: #4ade80; border: 1px solid #14532d; }

  /* Encryption info */
  .enc-info {
    margin-top: 8px;
    padding: 8px 12px;
    background: #0f172a;
    border-radius: 8px;
    font-size: 11px;
    color: #6b7280;
    font-family: monospace;
    word-break: break-all;
  }
  .enc-info span { color: #a78bfa; }

  /* Input area */
  .input-area {
    padding: 16px 24px;
    background: #111827;
    border-top: 1px solid #1f2937;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 10px;
    color: #e0e0e0;
    padding: 12px;
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.5;
  }
  textarea:focus { border-color: #a78bfa; }
  button {
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  button:hover { background: #6d28d9; }
  button:disabled { background: #374151; cursor: not-allowed; }

  /* Loading */
  .loading { color: #6b7280; font-size: 13px; font-style: italic; }
  .typing-dots::after {
    content: '...';
    animation: dots 1s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="shield">🛡️</div>
  <div>
    <div class="header-title">Quantum Guard AI Gateway</div>
    <div class="header-sub">ML-KEM-768 + AES-256-GCM · NLP Filter Active</div>
  </div>
  <div class="status-dot"></div>
  <div class="status-label">Protected</div>
</div>

<div class="chat-area" id="chatArea">
  <div class="message system">
    Gateway active — all prompts are inspected before reaching the LLM.
    Sensitive data is blocked or quantum-encrypted automatically.
  </div>
</div>

<div class="input-area">
  <textarea
    id="promptInput"
    placeholder="Type your message... (try something sensitive to see it blocked)"
    rows="1"
    onkeydown="handleKey(event)"
  ></textarea>
  <button id="sendBtn" onclick="sendPrompt()">Send</button>
</div>

<script>
  const GATEWAY = 'http://localhost:8000/v1/chat/completions';

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendPrompt();
    }
  }

  function addMessage(content, type) {
    const area = document.getElementById('chatArea');
    const div  = document.createElement('div');
    div.className = `message ${type}`;
    div.innerHTML  = content;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div;
  }

  async function sendPrompt() {
    const input = document.getElementById('promptInput');
    const btn   = document.getElementById('sendBtn');
    const prompt = input.value.trim();
    if (!prompt) return;

    // Show user message
    addMessage(prompt, 'user');
    input.value = '';
    btn.disabled = true;

    // Show loading
    const loading = addMessage(
      '<span class="loading typing-dots">Quantum Guard AI inspecting</span>',
      'assistant'
    );

    try {
      const res = await fetch(GATEWAY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await res.json();
      loading.remove();

      const tier  = data.tier  || 'LOW';
      const score = data.score || '0/100';
      const method = data.encryption_method || 'AES-256-GCM';

      if (data.status === 'blocked') {
        // BLOCKED
        const reasons = (data.reasons || []).join(', ');
        addMessage(`
          <div class="security-badge badge-high">🚫 BLOCKED — HIGH RISK</div>
          <div><strong>Score:</strong> ${score}</div>
          <div style="margin-top:6px;color:#f87171;">
            This prompt was blocked by Quantum Guard AI.<br>
            Sensitive data detected: ${reasons}
          </div>
          <div style="margin-top:8px;font-size:12px;color:#6b7280;">
            Prompt was NOT forwarded to the LLM.
          </div>
        `, 'blocked');

      } else {
        // FORWARDED — show encryption details + response
        const reply = data.choices?.[0]?.message?.content || 'No response';
        const enc   = data.encrypted_prompt || {};
        const kem   = enc.kem_ciphertext || null;

        const badgeClass = tier === 'MODERATE' ? 'badge-moderate' : 'badge-low';
        const badgeIcon  = tier === 'MODERATE' ? '🔐' : '🔒';
        const badgeText  = tier === 'MODERATE'
          ? 'MODERATE — ML-KEM-768 + AES-256-GCM'
          : 'LOW — AES-256-GCM';

        let encHtml = '';
        if (kem) {
          encHtml = `
            <div class="enc-info">
              <div><span>Method:</span> ${method}</div>
              <div><span>KEM ct:</span> ${kem}</div>
              <div><span>AES ct:</span> ${enc.ciphertext || ''}</div>
              <div style="margin-top:4px;color:#4ade80;">
                ✅ Prompt was quantum-encrypted before leaving your network
              </div>
            </div>`;
        } else {
          encHtml = `
            <div class="enc-info">
              <div><span>Method:</span> ${method}</div>
              <div style="margin-top:4px;color:#4ade80;">
                ✅ Prompt was AES-encrypted before leaving your network
              </div>
            </div>`;
        }

        addMessage(`
          <div class="security-badge ${badgeClass}">${badgeIcon} ${badgeText}</div>
          <div><strong>Score:</strong> ${score}</div>
          <div style="margin-top:8px;">${reply}</div>
          ${encHtml}
        `, 'assistant');
      }

    } catch (err) {
      loading.remove();
      addMessage(`
        <div style="color:#f87171;">
          ❌ Could not reach gateway — is it running on port 8000?<br>
          <small>${err.message}</small>
        </div>
      `, 'blocked');
    }

    btn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
